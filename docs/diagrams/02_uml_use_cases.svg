<text x="960.0" y="242" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Google Identity</text>
<ellipse cx="540.0" cy="145.0" rx="140.0" ry="35.0" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="140.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Browse search</text>
<text x="540.0" y="161.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">and filter</text>
<ellipse cx="540.0" cy="255.0" rx="140.0" ry="35.0" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="250.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Register or sign in</text>
<text x="540.0" y="271.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Password or Google</text>
<ellipse cx="540.0" cy="365.0" rx="140.0" ry="35.0" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="370.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Submit competing bid</text>
<ellipse cx="540.0" cy="475.0" rx="140.0" ry="35.0" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="470.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Buy now</text>
<text x="540.0" y="491.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Record sale only</text>
<ellipse cx="540.0" cy="585.0" rx="140.0" ry="35.0" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="580.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Manage watchlist</text>
<text x="540.0" y="601.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">and account activity</text>
<ellipse cx="540.0" cy="695.0" rx="140.0" ry="35.0" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="690.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Publish listing</text>
<text x="540.0" y="711.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">with product photo</text>
<ellipse cx="540.0" cy="782.5" rx="140.0" ry="32.5" fill="white" stroke="#334155" stroke-width="1.6"/>
<text x="540.0" y="777.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">Cancel auction or</text>
<text x="540.0" y="798.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b3a">accept highest bid</text>
<text x="30" y="881" font-family="Arial" font-size="14" fill="#475569">Roles are contextual: the same signed in account can buy and sell, and can browse or sign in as a visitor.</text>
<text x="30" y="903" font-family="Arial" font-size="14" fill="#475569">Bid, buy, watchlist, listing and seller actions require authentication as a precondition.</text>
<text x="30" y="925" font-family="Arial" font-size="14" fill="#475569">Seller ownership is a server side precondition. This UML model was authored as editable diagrams.net XML.</text>
